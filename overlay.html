<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KickPulse Overlay</title>
    <style>
      /* Must be truly transparent — a default white/black body background
         here would paint a solid box over the whole screen instead of
         letting the game show through. */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay-main.tsx"></script>
  </body>
</html>
